<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gallery — Waterfords Golden Hearts School</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="container">
      <a class="brand" href="http://waterfordsgoldenhearts.co.ke" target="_blank" rel="noopener">
        <img src="images/logo.png" alt="Waterfords Golden Hearts School logo" class="logo">
        <h1>waterfordsgoldenhearts.co.ke</h1>
      </a>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="admissions.html">Admissions</a>
        <a href="academics.html">Academics</a>
        <a href="staff.html">Staff</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <h2>Gallery</h2>
    <p>Photos from school events and everyday life. Add images to images/gallery/ and they'll appear here.</p>
    <div class="cards" id="gallery"></div>
  </main>
  <footer class="container">
    <p>&copy; 2026 Waterfords Golden Hearts School</p>
  </footer>
  <script>
    (function(){
      const gallery = document.getElementById('gallery');
      const images = [
        'images/gallery/placeholder1.jpg',
        'images/gallery/placeholder2.jpg',
        'images/gallery/placeholder3.jpg'
      ];
      images.forEach(src => {
        const div = document.createElement('div'); div.className='card';
        const img = document.createElement('img'); img.src=src; img.style.width='100%'; img.style.borderRadius='8px'; img.alt='Gallery image';
        div.appendChild(img); gallery.appendChild(div);
      });
    })();
  </script>
</body>
</html>
